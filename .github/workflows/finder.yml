name: finder
# Deterministic: runs the fuzzer, raises the level when clean, files ONE issue, dispatches the solver.
# Costs no LLM requests.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      just_failed:
        description: Set by the solver when it just failed (counts toward the auto-pause cap)
        required: false
        default: 'false'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: harness-finder
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # finder reads the git history of harness/PAUSE
      - uses: actions/setup-python@v5
        with:
          python-version-file: harness/python-version.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run finder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JUST_FAILED: ${{ inputs.just_failed }}
        run: python tools/finder.py
